<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><title>光学吸收实验助手</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#17324d;background:#f3f7fa}*{box-sizing:border-box}body{margin:0}header{background:#102a43;color:white;padding:24px 18px 17px}header h1{margin:0;font-size:22px}header small{opacity:.8}main{max-width:740px;margin:auto;padding:16px 14px 90px}.card{background:white;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 3px 14px #17324d0b}h2{font-size:17px;margin:0 0 13px}label{display:block;font-size:13px;color:#526879;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;border:1px solid #d7e2e9;border-radius:10px;padding:11px;background:white;color:#17324d}textarea{min-height:75px}button{font:inherit;border:0;border-radius:11px;padding:11px 14px;background:#087c91;color:white;font-weight:600;cursor:pointer}button.secondary{background:#e9f2f5;color:#17546a}button.danger{background:#fff0ed;color:#a13a2c}button:disabled{opacity:.45}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:white;border-top:1px solid #e3eaf0;padding:9px 3px max(9px,env(safe-area-inset-bottom))}nav button{background:transparent;color:#597183;font-size:13px;padding:8px 3px;border-radius:8px;flex:1}nav button.active{background:#e8f5f5;color:#087c91}.muted{color:#708494;font-size:13px}.pill{display:inline-block;border-radius:20px;padding:4px 9px;background:#e7f5f1;color:#147d65;font-size:12px}.step{border:1px solid #e1eaf0;border-radius:13px;padding:12px;margin:10px 0}.step h3{font-size:15px;margin:0 0 8px}.step p{font-size:14px;line-height:1.6;margin:7px 0}.step input[type=checkbox]{width:auto;margin-right:8px}.notice{background:#fff8e8;border-left:3px solid #e0a23c;padding:9px;font-size:13px;line-height:1.6}.hidden{display:none}.record{border-bottom:1px solid #e7edf1;padding:12px 0}.record:last-child{border:0}.topspace{margin-top:12px}</style></head><body><header><h1>🔬 光学吸收实验助手</h1><small>实验操作 · 镜片档案 · 测量追溯</small></header><main id="app"></main><nav id="nav"></nav><script>
const KEY='optics-lab-v01';const defaults=[{title:'镜片预处理',detail:'专用镜布擦拭 → 绿色光源检查 → 按现场规程进行高温清洗（约60分钟，仅供参考）。',caution:'确认清洗药剂、设备程序及高温取放要求。'},{title:'设备状态检查',detail:'检查西门子显示屏气压及设备状态是否稳定。',caution:'压力范围和调节方式待确认；不得凭本应用自行调整气瓶。'},{title:'镜片安装',detail:'确认设备处于安全安装状态；先装参考片，再装测试片，注意温度测量柱。',caution:'安装前按正式规程确认激光、冲洗及循环状态。'},{title:'光路检查',detail:'按正式规程由受训人员检查入射与反射光斑位置。',caution:'激光可能存在Class 4暴露风险；不可依据本应用擅自开盖、关灯或操作显影纸。'},{title:'气体冲洗',detail:'样品舱与整形舱按规定冲洗；现场经验约70分钟。',caution:'冲洗期间软件电压显示2500 mV；这不是气体达标的充分依据。'},{title:'气体循环',detail:'冲洗完成后按规程开启循环，观察气体及温度相关状态。',caution:'开启循环后电压开始显示变化数值；具体信号含义待确认。'},{title:'测量准备',detail:'核对软件参数、参考片和测试片信息；按现场要求确认测量条件。',caution:'静置时间曾记录4800秒及5000秒，须以本次实际参数为准。'},{title:'正式测量',detail:'当现有测量软件真正开始测量时，点击本应用「记录开始测量时间」。',caution:'本应用仅做记录，不控制激光器或实验设备。'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};state=state||{samples:[],records:[],steps:defaults};let page='home',current=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();const dt=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'尚未记录';const sampleName=x=>state.samples.find(s=>s.id===x)?.name||'未选择';const el=()=>document.getElementById('app');function go(p){page=p;render()}function render(){document.getElementById('nav').innerHTML=[['home','首页'],['new','新实验'],['samples','镜片'],['records','记录'],['guide','流程']].map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');if(page==='home')home();if(page==='new')newExp();if(page==='samples')samples();if(page==='records')records();if(page==='guide')guide();if(page==='detail')detail()}
function home(){let last=state.records.slice().reverse().slice(0,4);el().innerHTML=`<section class="card"><h2>开始工作</h2><p class="muted">记录每片镜片的正式测量开始时间，操作步骤可勾选。</p><button onclick="go('new')">＋ 开始新实验</button></section><section class="card"><h2>最近实验</h2>${last.length?last.map(r=>`<div class="record" onclick="openRec('${r.id}')"><b>${esc(sampleName(r.test))}</b> · ${esc(sampleName(r.ref))}<br><span class="muted">${dt(r.started)} · ${r.started?'已记录测量':'未开始测量'}</span></div>`).join(''):'<p class="muted">还没有实验记录</p>'}</section><section class="card"><h2>本地数据</h2><p class="muted">数据保存在当前浏览器中，不会自动同步。建议定期导出备份。</p><button class="secondary" onclick="exportData()">导出 JSON 备份</button> <button class="secondary" onclick="document.getElementById('restore').click()">导入备份</button><input class="hidden" type="file" id="restore" accept="application/json" onchange="importData(event)"></section>`}
function newExp(){el().innerHTML=`<section class="card"><h2>新建实验</h2><label>测试片</label><select id="test"><option value="">请选择</option>${state.samples.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>参考片 / 基准片</label><select id="ref"><option value="">请选择</option>${state.samples.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><p class="muted">没有镜片？请先到「镜片」页面建立档案。</p><label>本次备注（选填）</label><textarea id="memo" placeholder="实验目的、批次等"></textarea><button onclick="createExp()">建立实验记录</button></section>`}
function createExp(){let test=document.getElementById('test').value,ref=document.getElementById('ref').value;if(!test||!ref)return alert('请选择测试片和参考片');let r={id:id(),created:new Date().toISOString(),test,ref,started:null,memo:document.getElementById('memo').value,checks:{},steps:structuredClone(state.steps)};state.records.push(r);save();openRec(r.id)}
function samples(){el().innerHTML=`<section class="card"><h2>新增镜片</h2><label>镜片编号 / 名称 *</label><input id="sname" placeholder="例如：S-001 或 REF-001"><label>材料（选填）</label><input id="smat" placeholder="例如：熔石英"><label>备注（选填）</label><textarea id="snote"></textarea><button onclick="addSample()">保存镜片</button></section><section class="card"><h2>镜片库（${state.samples.length}）</h2>${state.samples.map(s=>`<div class="record"><b>${esc(s.name)}</b><div class="muted">${esc(s.material||'材料未填')} · ${esc(s.note||'无备注')}</div></div>`).join('')||'<p class="muted">尚无镜片</p>'}</section>`}
function addSample(){let name=document.getElementById('sname').value.trim();if(!name)return alert('请输入镜片编号');if(state.samples.some(s=>s.name===name))return alert('编号已存在');state.samples.push({id:id(),name,material:document.getElementById('smat').value,note:document.getElementById('snote').value});save();render()}
function records(){el().innerHTML=`<section class="card"><h2>历史测量（${state.records.length}）</h2>${state.records.slice().reverse().map(r=>`<div class="record"><b>${esc(sampleName(r.test))}</b> / ${esc(sampleName(r.ref))}<br><span class="muted">创建：${dt(r.created)}<br>开始测量：${dt(r.started)}</span><div class="topspace"><button class="secondary" onclick="openRec('${r.id}')">查看记录</button></div></div>`).join('')||'<p class="muted">暂无记录</p>'}</section>`}
function openRec(x){current=x;page='detail';render()}function detail(){let r=state.records.find(r=>r.id===current);if(!r)return go('records');el().innerHTML=`<section class="card"><h2>实验记录</h2><div class="pill">${r.started?'已开始测量':'准备中'}</div><p><b>测试片：</b>${esc(sampleName(r.test))}<br><b>参考片：</b>${esc(sampleName(r.ref))}<br><b>创建：</b>${dt(r.created)}<br><b>正式测量开始：</b>${dt(r.started)}</p>${!r.started?`<button onclick="startMeasure('${r.id}')">● 记录开始测量时间</button>`:`<button class="secondary" onclick="editTime('${r.id}')">修正开始时间</button>`}<label>实验备注 / 异常</label><textarea id="rmemo" onchange="updateMemo('${r.id}')">${esc(r.memo)}</textarea></section><section class="card"><h2>操作检查</h2><p class="muted">以下为学习记录，安全关键步骤须按正式规程执行。</p>${r.steps.map((s,i)=>`<div class="step"><h3><label style="font-size:15px;color:inherit;margin:0"><input type="checkbox" ${r.checks[i]?'checked':''} onchange="checkStep('${r.id}',${i},this.checked)">${i+1}. ${esc(s.title)}</label></h3><p>${esc(s.detail)}</p><div class="notice">⚠ ${esc(s.caution)}</div></div>`).join('')}</section>`}
function startMeasure(x){if(!confirm('确认现有测量软件已经正式开始测量？'))return;let r=state.records.find(r=>r.id===x);r.started=new Date().toISOString();save();render()}function editTime(x){let r=state.records.find(r=>r.id===x),v=prompt('输入测量开始时间（格式：YYYY-MM-DD HH:mm）',r.started?new Date(r.started).toLocaleString('sv-SE').slice(0,16):'');if(v===null)return;let d=new Date(v.replace(' ','T'));if(isNaN(d))return alert('时间格式无效');r.started=d.toISOString();save();render()}function updateMemo(x){state.records.find(r=>r.id===x).memo=document.getElementById('rmemo').value;save()}function checkStep(x,i,v){state.records.find(r=>r.id===x).checks[i]=v;save()}
function guide(){el().innerHTML=`<section class="card"><h2>标准流程模板</h2><p class="muted">修改仅影响以后新建的实验；历史实验保留当时的流程。</p>${state.steps.map((s,i)=>`<div class="step"><h3>${i+1}. ${esc(s.title)}</h3><p>${esc(s.detail)}</p><div class="notice">⚠ ${esc(s.caution)}</div><div class="row topspace"><button class="secondary" onclick="editStep(${i})">编辑</button><button class="secondary" onclick="moveStep(${i},-1)">↑</button><button class="secondary" onclick="moveStep(${i},1)">↓</button><button class="danger" onclick="removeStep(${i})">删除</button></div></div>`).join('')}<button onclick="addStep()">＋ 添加步骤</button> <button class="secondary" onclick="resetSteps()">恢复初始模板</button></section>`}
function editStep(i){let s=state.steps[i],title=prompt('步骤名称',s.title);if(title===null)return;let detail=prompt('操作说明',s.detail);if(detail===null)return;let caution=prompt('注意事项',s.caution);if(caution===null)return;state.steps[i]={title,detail,caution};save();render()}function addStep(){let title=prompt('新步骤名称');if(!title)return;state.steps.push({title,detail:'待补充',caution:'请遵守现场正式操作规程'});save();render()}function removeStep(i){if(confirm('删除模板中的此步骤？历史记录不会改变。')){state.steps.splice(i,1);save();render()}}function moveStep(i,d){let j=i+d;if(j<0||j>=state.steps.length)return;[state.steps[i],state.steps[j]]=[state.steps[j],state.steps[i]];save();render()}function resetSteps(){if(confirm('恢复初始流程模板？')){state.steps=structuredClone(defaults);save();render()}}
function exportData(){let blob=new Blob([JSON.stringify({app:'optics-lab',version:1,exported:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='光学实验备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='optics-lab'||!Array.isArray(obj.state.samples)||!Array.isArray(obj.state.records)||!Array.isArray(obj.state.steps))throw Error('格式不正确');if(!confirm('导入将替换本机当前数据，建议先导出备份。继续？'))return;state=obj.state;save();go('home')}catch(err){alert('导入失败：'+err.message)}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
