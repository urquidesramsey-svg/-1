verflow-wrap:anywhere} .toolbar{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toolbar input{grid-column:1/-1}.mini{font-size:12px;color:#6c8090}.paramgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.paramgrid label{margin:5px 0}.paramgrid input,.paramgrid select{padding:9px}.compact{padding:10px 0;border-bottom:1px solid #edf0f3}.compact:last-child{border:0}.scrollbox{max-height:55vh;overflow:auto}.tag{font-size:12px;background:#e9f2f5;border-radius:8px;padding:3px 7px}.selectbox{max-height:45vh;overflow:auto}.choice{display:block;width:100%;text-align:left;background:#f2f7f9;color:#17324d;margin:6px 0}.full{width:100%}

</style></head><body><header><h1>🔬 光学吸收实验助手</h1><small>实验操作 · 镜片档案 · 测量追溯</small></header><main id="app"></main><nav id="nav"></nav><script>
const KEY='optics-lab-v01';const defaults=[{title:'镜片预处理',detail:'专用镜布擦拭 → 绿色光源检查 → 按现场规程进行高温清洗（约60分钟，仅供参考）。',caution:'确认清洗药剂、设备程序及高温取放要求。'},{title:'设备状态检查',detail:'检查西门子显示屏气压及设备状态是否稳定。',caution:'压力范围和调节方式待确认；不得凭本应用自行调整气瓶。'},{title:'镜片安装',detail:'确认设备处于安全安装状态；先装参考片，再装测试片，注意温度测量柱。',caution:'安装前按正式规程确认激光、冲洗及循环状态。'},{title:'光路检查',detail:'按正式规程由受训人员检查入射与反射光斑位置。',caution:'激光可能存在Class 4暴露风险；不可依据本应用擅自开盖、关灯或操作显影纸。'},{title:'气体冲洗',detail:'样品舱与整形舱按规定冲洗；现场经验约70分钟。',caution:'冲洗期间软件电压显示2500 mV；这不是气体达标的充分依据。'},{title:'气体循环',detail:'冲洗完成后按规程开启循环，观察气体及温度相关状态。',caution:'开启循环后电压开始显示变化数值；具体信号含义待确认。'},{title:'测量准备',detail:'核对软件参数、参考片和测试片信息；按现场要求确认测量条件。',caution:'静置时间曾记录4800秒及5000秒，须以本次实际参数为准。'},{title:'正式测量',detail:'当现有测量软件真正开始测量时，点击本应用「记录开始测量时间」。',caution:'本应用仅做记录，不控制激光器或实验设备。'}];
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{};state=state||{samples:[],records:[],steps:defaults};state.samples=state.samples||[];state.records=state.records||[];state.steps=state.steps||structuredClone(defaults);state.samples.forEach(x=>{x.kind=x.kind||(/^(REF|基准|参考)/i.test(x.name)?'ref':'test');x.mass=x.mass??'';x.markDate=x.markDate||''});let page='home',current=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=()=>crypto.randomUUID?.()||Date.now()+'-'+Math.random();const dt=t=>t?new Date(t).toLocaleString('zh-CN',{hour12:false}):'尚未记录';const sampleName=x=>state.samples.find(s=>s.id===x)?.name||'未选择';const fmtSample=x=>{let s=state.samples.find(s=>s.id===x);return s?`${esc(s.name)} · ${esc(s.material||'材料未填')} · ${s.mass!==''?esc(s.mass)+' g':'质量待填'}`:'未选择'};const options=(kind,chosen)=>state.samples.filter(s=>s.kind===kind).map(s=>`<option value="${s.id}" ${s.id===chosen?'selected':''}>${esc(s.name)}${s.mass!==''?' · '+esc(s.mass)+'g':''}</option>`).join('');const el=()=>document.getElementById('app');function go(p){page=p;render()}function render(){document.getElementById('nav').innerHTML=[['home','首页'],['new','新实验'],['samples','镜片'],['templates','参数'],['records','记录'],['guide','流程']].map(([k,v])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${v}</button>`).join('');if(page==='home')home();if(page==='new')newExp();if(page==='samples')samples();if(page==='records')records();if(page==='guide')guide();if(page==='detail')detail();if(page==='templates')templates()}
function home(){let last=state.records.slice().reverse().slice(0,4);el().innerHTML=`<section class="card"><h2>开始工作</h2><p class="muted">记录每片镜片的正式测量开始时间，操作步骤可勾选。</p><button onclick="go('new')">＋ 开始新实验</button></section><section class="card"><h2>最近实验</h2>${last.length?last.map(r=>`<div class="record" onclick="openRec('${r.id}')"><b>${esc(sampleName(r.test))}</b> · 基准片 ${esc(sampleName(r.ref))}<br><span class="muted">${dt(r.started)} · ${r.started?'已记录测量':'未开始测量'}</span></div>`).join(''):'<p class="muted">还没有实验记录</p>'}</section><section class="card"><h2>本地数据</h2><p class="muted">数据保存在当前浏览器中，不会自动同步。建议定期导出备份。</p><button class="secondary" onclick="exportData()">导出完整备份（含报告）</button> <button class="secondary" onclick="document.getElementById('restore').click()">导入备份</button><input class="hidden" type="file" id="restore" accept="application/json" onchange="importData(event)"></section>`}
function newExp(){let def=state.samples.find(s=>s.kind==='ref'&&s.isDefault)?.id;el().innerHTML=`<section class="card"><h2>新建实验</h2><label>测试片（独立库）</label><select id="test"><option value="">请选择测试片</option>${options('test')}</select><label>基准片（默认自动选择）</label><select id="ref"><option value="">请选择基准片</option>${options('ref',def)}</select><p class="muted">两类镜片独立管理。若没有选项，请先到「镜片」页面添加。</p><label>本次备注（选填）</label><textarea id="memo" placeholder="实验目的、批次等"></textarea><button onclick="createExp()">建立实验记录</button></section>`}
function createExp(){let test=document.getElementById('test').value,ref=document.getElementById('ref').value;if(!test||!ref)return alert('请选择测试片和参考片');let r={id:id(),created:new Date().toISOString(),test,ref,started:null,memo:document.getElementById('memo').value,checks:{},steps:structuredClone(state.steps)};state.records.push(r);save();openRec(r.id)}
const MATERIALS=['熔石英','氧化铝陶瓷','铝','铜','其他/待确认'];
function samples(){let kind=window.sampleTab||'test';let list=state.samples.filter(x=>x.kind===kind);el().innerHTML=`<section class="card"><h2>镜片管理 V0.3</h2><div class="row"><button class="${kind==='test'?'':'secondary'}" onclick="window.sampleTab='test';render()">测试片（${state.samples.filter(x=>x.kind==='test').length}）</button><button class="${kind==='ref'?'':'secondary'}" onclick="window.sampleTab='ref';render()">基准片（${state.samples.filter(x=>x.kind==='ref').length}）</button></div><p class="muted">测试片与基准片分别保存，编号可以相同，不会相互覆盖。</p></section><section class="card"><h2>新增${kind==='ref'?'基准片':'测试片'}</h2><label>镜片编号 *</label><input id="sname" placeholder="例如：①、S-001、REF-001"><label>材料</label><select id="smat">${MATERIALS.map(x=>`<option>${x}</option>`).join('')}</select><label>质量（g，可留空）</label><input id="smass" inputmode="decimal" type="number" min="0" step="0.0001" placeholder="例如 1.1549"><label>包装标注日期（可留空）</label><input id="sdate" placeholder="例如 8/23（年份不明可不填）"><label>备注</label><textarea id="snote"></textarea><button onclick="addSample()">保存镜片</button></section>${kind==='test'?`<section class="card"><h2>批量导入测试片</h2><p class="muted">支持 CSV 表格；列名：编号,材料,质量(g),日期,备注。导入前逐条检查；重复编号跳过，不覆盖。</p><button class="secondary" onclick="downloadTemplate()">下载 CSV 模板</button> <button onclick="document.getElementById('batchfile').click()">选择 CSV 文件</button><input id="batchfile" class="hidden" type="file" accept=".csv,text/csv" onchange="loadBatch(event)"><div id="batch-preview"></div></section>`:''}<section class="card"><h2>${kind==='ref'?'基准片':'测试片'}列表（${list.length}）</h2>${list.map(s=>`<div class="record"><b>${esc(s.name)}</b> ${s.isDefault?'<span class="pill">默认基准片</span>':''}<div class="muted">${esc(s.material||'材料待确认')} · ${s.mass!==''?esc(s.mass)+' g':'质量待填'} · ${esc(s.markDate||'日期待填')}</div><div class="row topspace"><button class="secondary" onclick="editSample('${s.id}')">编辑</button>${kind==='ref'&&!s.isDefault?`<button onclick="setDefault('${s.id}')">设为默认</button>`:''}</div></div>`).join('')||'<p class="muted">尚无镜片</p>'}</section>`}
function addSample(){let kind=window.sampleTab||'test',name=document.getElementById('sname').value.trim(),mass=document.getElementById('smass').value;if(!name)return alert('请输入镜片编号');if(state.samples.some(s=>s.kind===kind&&s.name===name))return alert('此分类下编号已存在');if(mass!==''&&(!Number.isFinite(+mass)||+mass<=0))return alert('质量必须为正数');state.samples.push({id:id(),kind,name,material:document.getElementById('smat').value,mass,markDate:document.getElementById('sdate').value.trim(),note:document.getElementById('snote').value,isDefault:kind==='ref'&&!state.samples.some(s=>s.kind==='ref'&&s.isDefault)});save();render()}
function setDefault(x){state.samples.forEach(s=>{if(s.kind==='ref')s.isDefault=s.id===x});save();render()}
function editSample(x){let s=state.samples.find(v=>v.id===x);if(!s)return;let name=prompt('镜片编号',s.name);if(name===null)return;name=name.trim();if(!name)return alert('编号不能为空');if(state.samples.some(v=>v.id!==x&&v.kind===s.kind&&v.name===name))return alert('编号已存在');let material=prompt('材料（熔石英/氧化铝陶瓷/铝/铜/其他）',s.material||'');if(material===null)return;let mass=prompt('质量（g；不确定可留空）',s.mass??'');if(mass===null)return;if(mass!==''&&(!Number.isFinite(+mass)||+mass<=0))return alert('质量无效');let markDate=prompt('标注日期',s.markDate||'');if(markDate===null)return;let note=prompt('备注',s.note||'');if(note===null)return;Object.assign(s,{name,material,mass,markDate,note});save();render()}
function downloadTemplate(){let rows=['编号,材料,质量(g),日期,备注','1,待确认,,8/3,请核对原照片','2,待确认,,9/13,请核对原照片'];downloadFile('镜片批量导入模板.csv','\ufeff'+rows.join('\r\n'),'text/csv;charset=utf-8')}
function downloadFile(name,data,type){let a=document.createElement('a'),url=URL.createObjectURL(new Blob([data],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}
function parseCSV(t){let rows=[],row=[],v='',quoted=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(quoted&&t[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(v);v=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&t[i+1]==='\n')i++;row.push(v);v='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else v+=c}row.push(v);if(row.some(x=>x.trim()))rows.push(row);return rows}
let pendingBatch=[];async function loadBatch(e){let f=e.target.files[0];if(!f)return;let rows=parseCSV((await f.text()).replace(/^\ufeff/,''));let headers=rows.shift().map(x=>x.trim());let get=(r,names)=>{let i=headers.findIndex(h=>names.includes(h));return i<0?'':(r[i]||'').trim()};pendingBatch=rows.map(r=>({name:get(r,['编号','镜片编号','name']),material:get(r,['材料','material'])||'待确认',mass:get(r,['质量(g)','质量','mass']),markDate:get(r,['日期','标注日期','date']),note:get(r,['备注','note'])})).filter(x=>x.name);let area=document.getElementById('batch-preview');area.innerHTML=`<h3>导入预览（${pendingBatch.length}条）</h3><p class="muted">请逐条核对，尤其是质量。可直接编辑下方内容。</p>${pendingBatch.map((r,i)=>`<div class="step"><b>第${i+1}条</b><label>编号</label><input data-i="${i}" data-k="name" value="${esc(r.name)}"><label>材料</label><select data-i="${i}" data-k="material">${[...new Set([...MATERIALS,r.material])].map(m=>`<option ${m===r.material?'selected':''}>${esc(m)}</option>`).join('')}</select><label>质量(g)</label><input data-i="${i}" data-k="mass" inputmode="decimal" value="${esc(r.mass)}"><label>日期</label><input data-i="${i}" data-k="markDate" value="${esc(r.markDate)}"><label>备注</label><input data-i="${i}" data-k="note" value="${esc(r.note)}"></div>`).join('')}<button onclick="confirmBatch()">确认导入测试片</button>`}
function confirmBatch(){document.querySelectorAll('#batch-preview [data-i]').forEach(e=>pendingBatch[+e.dataset.i][e.dataset.k]=e.value.trim());let bad=pendingBatch.find(x=>!x.name||(x.mass!==''&&(!Number.isFinite(+x.mass)||+x.mass<=0)));if(bad)return alert('存在空编号或无效质量，请检查');let seen=new Set(),added=0,skipped=0;for(let r of pendingBatch){if(seen.has(r.name)||state.samples.some(s=>s.kind==='test'&&s.name===r.name)){skipped++;continue}seen.add(r.name);state.samples.push({id:id(),kind:'test',...r});added++}save();pendingBatch=[];alert(`成功导入${added}片，跳过重复编号${skipped}片。`);render()}
function records(){el().innerHTML=`<section class="card"><h2>历史测量（${state.records.length}）</h2>${state.records.slice().reverse().map(r=>`<div class="record"><b>${esc(sampleName(r.test))}</b> / 基准片 ${esc(sampleName(r.ref))}<br><span class="muted">创建：${dt(r.created)}<br>开始测量：${dt(r.started)}</span><div class="topspace"><button class="secondary" onclick="openRec('${r.id}')">查看记录</button></div></div>`).join('')||'<p class="muted">暂无记录</p>'}</section>`}
function openRec(x){current=x;page='detail';render()}function detail(){let r=state.records.find(r=>r.id===current);if(!r)return go('records');el().innerHTML=`<section class="card"><h2>实验记录</h2><div class="pill">${r.started?'已开始测量':'准备中'}</div><p><b>测试片：</b>${fmtSample(r.test)}<br><b>基准片：</b>${fmtSample(r.ref)}<br><b>创建：</b>${dt(r.created)}<br><b>正式测量开始：</b>${dt(r.started)}</p>${!r.started?`<button onclick="startMeasure('${r.id}')">● 记录开始测量时间</button>`:`<button class="secondary" onclick="editTime('${r.id}')">修正开始时间</button>`}<label>实验备注 / 异常</label><textarea id="rmemo" onchange="updateMemo('${r.id}')">${esc(r.memo)}</textarea></section><section class="card"><h2>操作检查</h2><p class="muted">以下为学习记录，安全关键步骤须按正式规程执行。</p>${r.steps.map((s,i)=>`<div class="step"><h3><label style="font-size:15px;color:inherit;margin:0"><input type="checkbox" ${r.checks[i]?'checked':''} onchange="checkStep('${r.id}',${i},this.checked)">${i+1}. ${esc(s.title)}</label></h3><p>${esc(s.detail)}</p><div class="notice">⚠ ${esc(s.caution)}</div></div>`).join('')}</section>`}
function startMeasure(x){if(!confirm('确认现有测量软件已经正式开始测量？'))return;let r=state.records.find(r=>r.id===x);r.started=new Date().toISOString();save();render()}function editTime(x){let r=state.records.find(r=>r.id===x),v=prompt('输入测量开始时间（格式：YYYY-MM-DD HH:mm）',r.started?new Date(r.started).toLocaleString('sv-SE').slice(0,16):'');if(v===null)return;let d=new Date(v.replace(' ','T'));if(isNaN(d))return alert('时间格式无效');r.started=d.toISOString();save();render()}function updateMemo(x){state.records.find(r=>r.id===x).memo=document.getElementById('rmemo').value;save()}function checkStep(x,i,v){state.records.find(r=>r.id===x).checks[i]=v;save()}
function guide(){el().innerHTML=`<section class="card"><h2>标准流程模板</h2><p class="muted">修改仅影响以后新建的实验；历史实验保留当时的流程。</p>${state.steps.map((s,i)=>`<div class="step"><h3>${i+1}. ${esc(s.title)}</h3><p>${esc(s.detail)}</p><div class="notice">⚠ ${esc(s.caution)}</div><div class="row topspace"><button class="secondary" onclick="editStep(${i})">编辑</button><button class="secondary" onclick="moveStep(${i},-1)">↑</button><button class="secondary" onclick="moveStep(${i},1)">↓</button><button class="danger" onclick="removeStep(${i})">删除</button></div></div>`).join('')}<button onclick="addStep()">＋ 添加步骤</button> <button class="secondary" onclick="resetSteps()">恢复初始模板</button></section>`}
function editStep(i){let s=state.steps[i],title=prompt('步骤名称',s.title);if(title===null)return;let detail=prompt('操作说明',s.detail);if(detail===null)return;let caution=prompt('注意事项',s.caution);if(caution===null)return;state.steps[i]={title,detail,caution};save();render()}function addStep(){let title=prompt('新步骤名称');if(!title)return;state.steps.push({title,detail:'待补充',caution:'请遵守现场正式操作规程'});save();render()}function removeStep(i){if(confirm('删除模板中的此步骤？历史记录不会改变。')){state.steps.splice(i,1);save();render()}}function moveStep(i,d){let j=i+d;if(j<0||j>=state.steps.length)return;[state.steps[i],state.steps[j]]=[state.steps[j],state.steps[i]];save();render()}function resetSteps(){if(confirm('恢复初始流程模板？')){state.steps=structuredClone(defaults);save();render()}}

newExp=function(){selectedTest=selectedTest||expDraft.test||'';selectedRef=selectedRef||expDraft.ref||state.samples.find(x=>x.kind==='ref'&&x.isDefault)?.id||'';oldNewExpV3();let top=el().querySelector('.card');top.innerHTML=`<h2>① 选择镜片</h2><label>测试片</label><button class="secondary full" onclick="openPicker('test')" id="pickTest">选择测试片</button><label>基准片（自动沿用默认）</label><button class="secondary full" onclick="openPicker('ref')" id="pickRef">选择基准片</button><p class="muted">点击镜片即选中，无需二次确认；每次实验仅一片测试片。</p>`;refreshPicked();if(expDraft.testTpl&&document.getElementById('testTpl')){document.getElementById('testTpl').value=expDraft.testTpl;applyTpl('test')}if(expDraft.analysisTpl&&document.getElementById('analysisTpl')){document.getElementById('analysisTpl').value=expDraft.analysisTpl;applyTpl('analysis')}restoreExp();el().querySelectorAll('input,select,textarea').forEach(x=>{x.addEventListener('input',captureExp);x.addEventListener('change',captureExp)});el().insertAdjacentHTML('beforeend','<p class="mini" id="statusmsg" role="status">实验草稿自动保存在当前设备</p>')};
function refreshPicked(){let t=state.samples.find(x=>x.id===selectedTest),r=state.samples.find(x=>x.id===selectedRef);let a=document.getElementById('pickTest'),b=document.getElementById('pickRef');if(a)a.textContent=t?`${t.name} · ${t.material||'材料待填'} · ${t.mass||'质量待填'} g  ▾`:'🔍 点击选择测试片';if(b)b.textContent=r?`${r.name} · ${r.material||'材料待填'}  ▾`:'🔍 点击选择基准片'}
function openPicker(kind){captureExp();pickerKind=kind;pickerQuery='';pickerFilter='all';let box=document.createElement('div');box.id='pickerOverlay';box.className='overlay';box.innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between;align-items:center"><h2>选择${kind==='test'?'测试片':'基准片'}</h2><button class="secondary" onclick="closePicker()">关闭</button></div><input id="pickerSearch" placeholder="输入编号、材料或批次" oninput="pickerQuery=this.value;renderPickerRows()" autocomplete="off"><div class="row topspace"><button class="secondary" onclick="pickerFilter='all';renderPickerRows()">全部</button><button class="secondary" onclick="pickerFilter='recent';renderPickerRows()">最近使用</button>${kind==='test'?`<button class="secondary" onclick="pickerFilter='todo';renderPickerRows()">未测量</button>`:''}</div><div id="pickerRows" class="topspace"></div></div>`;document.body.appendChild(box);renderPickerRows();document.getElementById('pickerSearch').focus()}
function closePicker(){document.getElementById('pickerOverlay')?.remove()}
function renderPickerRows(){let q=pickerQuery.trim().toLowerCase(),list=state.samples.filter(x=>x.kind===pickerKind&&[x.name,x.material,x.batch].some(v=>String(v||'').toLowerCase().includes(q)));if(pickerFilter==='todo')list=list.filter(x=>!completed(x.id));if(pickerFilter==='recent'){let rank=new Map();state.records.slice().reverse().forEach((r,i)=>{let key=pickerKind==='test'?r.test:r.ref;if(!rank.has(key))rank.set(key,i)});list=list.filter(x=>rank.has(x.id)).sort((a,b)=>rank.get(a.id)-rank.get(b.id))}let area=document.getElementById('pickerRows');if(!area)return;area.innerHTML=list.slice(0,80).map(x=>`<div class="picker-row"><button class="pick-main" onclick="pickOne('${x.id}')"><b>${esc(x.name)}</b><small>${esc(x.material||'材料待填')} · ${esc(x.mass||'质量待填')} g ${x.batch?'· '+esc(x.batch):''}</small></button><button class="secondary" onclick="openSampleEditor('${x.id}','picker')">编辑</button></div>`).join('')||'<p class="muted">没有匹配镜片，请在镜片管理中添加。</p>';if(q&&list.length===1)area.insertAdjacentHTML('afterbegin','<p class="mini">仅有一个匹配结果，点击该行即可选中。</p>')}
function pickOne(id){if(pickerKind==='test')selectedTest=id;else selectedRef=id;expDraft.test=selectedTest;expDraft.ref=selectedRef;draftSave();closePicker();refreshPicked();if(pickerKind==='test'){let x=state.samples.find(s=>s.id===id);let heat=document.getElementById('p_analysis_heat');if(heat&&x&&materialHeat[x.material])heat.value=materialHeat[x.material]}captureExp()}
function openSampleEditor(id,origin='samples'){let x=state.samples.find(s=>s.id===id);if(!x)return;editId=id;editorReturn=origin;if(origin==='picker')closePicker();let modal=document.createElement('div');modal.className='overlay';modal.id='editorOverlay';modal.innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between;align-items:center"><h2>编辑${x.kind==='ref'?'基准片':'测试片'}</h2><button class="secondary" onclick="closeSampleEditor()">关闭</button></div><p class="mini">可以连续修改所有内容，最后只需保存一次。</p><label>镜片编号 *</label><input id="ed_name" value="${esc(x.name)}"><label>材料</label><select id="ed_material">${[...new Set([...MATERIALS,x.material])].map(m=>`<option value="${esc(m)}" ${m===x.material?'selected':''}>${esc(m)}</option>`).join('')}</select><label>质量 (g)</label><input id="ed_mass" type="number" inputmode="decimal" step="0.0001" min="0" value="${esc(x.mass)}"><label>标注日期</label><input id="ed_markDate" value="${esc(x.markDate)}"><label>所属批次</label><input id="ed_batch" value="${esc(x.batch)}"><label>备注</label><textarea id="ed_note">${esc(x.note)}</textarea><p id="editorError" class="notice hidden"></p><button class="full topspace" onclick="saveSampleEditor()">保存全部修改</button></div>`;document.body.appendChild(modal)}
function closeSampleEditor(){document.getElementById('editorOverlay')?.remove();if(editorReturn==='picker')openPicker(pickerKind)}
function saveSampleEditor(){let x=state.samples.find(s=>s.id===editId);if(!x)return;let data={name:val('ed_name').trim(),material:val('ed_material'),mass:val('ed_mass').trim(),markDate:val('ed_markDate').trim(),batch:val('ed_batch').trim(),note:val('ed_note')};let error='';if(!data.name)error='镜片编号不能为空';else if(data.mass!==''&&(!Number.isFinite(Number(data.mass))||Number(data.mass)<=0))error='质量必须为正数';else if(state.samples.some(s=>s.id!==x.id&&s.kind===x.kind&&s.name===data.name&&(s.batch||'')===data.batch))error='该批次已有相同编号';if(error){let e=document.getElementById('editorError');e.textContent=error;e.classList.remove('hidden');return}Object.assign(x,data);save();document.getElementById('editorOverlay')?.remove();if(editorReturn==='picker'){openPicker(pickerKind);refreshPicked()}else samples()}
editSample=function(id){openSampleEditor(id)};
function editTemplate(kind,i){let t=state.templates[kind][i],fields=kind==='test'?TEST_FIELDS:ANALYSIS_FIELDS;let box=document.createElement('div');box.id='templateOverlay';box.className='overlay';box.innerHTML=`<div class="sheet"><div class="row" style="justify-content:space-between;align-items:center"><h2>编辑${kind==='test'?'测试':'分析'}模板</h2><button class="secondary" onclick="document.getElementById('templateOverlay').remove()">关闭</button></div><label>模板名称</label><input id="tplName" value="${esc(t.name)}">${fields.map(([key,label,,unit])=>`<label>${esc(label)} ${unit?'('+esc(unit)+')':''}</label><input data-template-key="${esc(key)}" value="${esc(t.values[key]??'')}">`).join('')}<button class="full topspace" onclick="saveTemplateEditor('${kind}',${i})">保存全部修改</button></div>`;document.body.appendChild(box)}
function saveTemplateEditor(kind,i){let name=val('tplName').trim();if(!name)return alert('请填写模板名称');let values={};document.querySelectorAll('[data-template-key]').forEach(e=>values[e.dataset.templateKey]=e.value);state.templates[kind][i]={name,values};save();document.getElementById('templateOverlay')?.remove();templates()}
const oldCreateV3=createExp;
createExp=function(){captureExp();if(!selectedTest||!selectedRef)return alert('请先选择测试片和基准片');oldCreateV3();expDraft={};localStorage.removeItem(DRAFT_KEY)};
const oldHomeV3=home;
home=function(){oldHomeV3();let c=el().querySelector('.card:last-child');if(c)c.insertAdjacentHTML('beforeend','<p class="mini">V0.4 保持使用旧版数据存储键（optics-lab-v01），正常同网址升级无需重新导入。数据仅保存在当前浏览器，请定期导出完整备份（含报告）；清理网站数据或更换设备可能丢失。</p>')};
const oldSamplesV3=samples;
samples=function(){oldSamplesV3();let h=el().querySelector('h2');if(h)h.textContent='镜片管理 V0.4'};


// V0.5: 本地实验提醒。沿用 V0.4 数据键，不清空既有记录。
state.reminderSettings=state.reminderSettings||{minutes:120};
function reminderFor(r){return r?.reminder||null}
function reminderTime(v){return new Date(v).toLocaleString('zh-CN',{hour12:false})}
function setReminderMinutes(){let v=Number(document.getElementById('reminderMinutes')?.value);if(!Number.isFinite(v)||v<1||v>1440)return alert('请输入1～1440分钟');state.reminderSettings.minutes=v;save();render()}
function setRecordReminder(rid){let r=state.records.find(x=>x.id===rid);if(!r)return;let mins=Number(document.getElementById('recordReminderMinutes')?.value||state.reminderSettings.minutes);if(!Number.isFinite(mins)||mins<1||mins>1440)return alert('请输入1～1440分钟');let base=r.started?new Date(r.started).getTime():Date.now();r.reminder={due:new Date(base+mins*60000).toISOString(),minutes:mins,done:false,notified:false};save();render()}
function reminderAction(rid,act){let r=state.records.find(x=>x.id===rid);if(!r?.reminder)return;if(act==='done')r.reminder.done=true;else if(act==='cancel')r.reminder=null;else if(act==='snooze'){r.reminder.due=new Date(Date.now()+10*60000).toISOString();r.reminder.notified=false}save();render()}
function reminderCard(r){let m=r.reminder;if(!m)return `<section class="card"><h2>🔔 下一片清洗提醒</h2><p class="mini">从正式开始测量起计算；如尚未开始，则从现在起计算。</p><div class="row"><input id="recordReminderMinutes" type="number" min="1" max="1440" value="${state.reminderSettings.minutes}" style="max-width:110px"><span style="align-self:center">分钟后</span><button onclick="setRecordReminder('${r.id}')">设置提醒</button></div></section>`;let delta=new Date(m.due).getTime()-Date.now(),label=m.done?'已完成':delta<=0?'⏰ 到时间了':'剩余 '+Math.floor(delta/3600000)+'小时'+Math.floor((delta%3600000)/60000)+'分钟';return `<section class="card"><h2>🔔 下一片清洗提醒</h2><p><b>${esc(label)}</b><br>提醒时间：${reminderTime(m.due)}</p><p class="mini">${m.done?'清洗提醒已完成':'软件打开时会提示；iPhone 锁屏或关闭网页后不能保证准时通知，请同时设置系统闹钟。'}</p><div class="row">${m.done?'':`<button onclick="reminderAction('${r.id}','done')">已清洗</button><button class="secondary" onclick="reminderAction('${r.id}','snooze')">推迟10分钟</button>`}<button class="secondary" onclick="reminderAction('${r.id}','cancel')">取消提醒</button></div></section>`}
const oldStartMeasureV4=startMeasure;
startMeasure=function(rid){let before=state.records.find(x=>x.id===rid)?.started;oldStartMeasureV4(rid);let r=state.records.find(x=>x.id===rid);if(!before&&r?.started){r.reminder={due:new Date(new Date(r.started).getTime()+Number(state.reminderSettings.minutes||120)*60000).toISOString(),minutes:state.reminderSettings.minutes||120,done:false,notified:false};save();render()}}
const oldDetailV4=detail;
detail=function(){oldDetailV4();let r=state.records.find(x=>x.id===current);if(r)el().insertAdjacentHTML('afterbegin',reminderCard(r))};
const oldHomeV4=home;
home=function(){oldHomeV4();let active=state.records.filter(r=>r.reminder&&!r.reminder.done).sort((a,b)=>new Date(a.reminder.due)-new Date(b.reminder.due));let html=`<section class="card"><h2>🔔 清洗提醒</h2><p class="mini">开始测量后自动创建下一片清洗提醒。</p><label>默认间隔（分钟）</label><div class="row"><input type="number" min="1" max="1440" id="reminderMinutes" value="${state.reminderSettings.minutes}" style="max-width:110px"><button class="secondary" onclick="setReminderMinutes()">保存设置</button></div>${active.length?active.map(r=>`<div class="compact"><b>${esc(sampleName(r.test))}</b> · ${reminderTime(r.reminder.due)} <button class="secondary" onclick="openRec('${r.id}')">查看</button></div>`).join(''):'<p class="mini">暂无进行中的清洗提醒</p>'}<p class="mini">提醒保存在本机。页面运行时可提示；锁屏、关闭应用或清除网站数据后不能保证提醒。</p></section>`;el().insertAdjacentHTML('afterbegin',html)};
let lastReminderCheck=0;
function checkDueReminders(){if(Date.now()-lastReminderCheck<10000)return;lastReminderCheck=Date.now();let due=state.records.filter(r=>r.reminder&&!r.reminder.done&&!r.reminder.notified&&Date.now()>=new Date(r.reminder.due).getTime());if(!due.length)return;for(let r of due)r.reminder.notified=true;save();if('Notification'in window&&Notification.permission==='granted'){for(let r of due){try{new Notification('该清洗下一片镜片了',{body:'当前测试片：'+sampleName(r.test)})}catch(e){}}}alert('🔔 到时间了：请清洗下一片镜片。\n'+due.map(r=>'当前测试片：'+sampleName(r.test)).join('\n'));if(page==='home'||page==='detail')render()}
setInterval(checkDueReminders,15000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkDueReminders()});

// V0.6: original report files stored separately from the existing local state.
const reportDB=()=>new Promise((resolve,reject)=>{let q=indexedDB.open('optics-lab-reports',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
async function reportOp(mode,fn){let db=await reportDB();try{return await new Promise((resolve,reject)=>{let tx=db.transaction('files',mode),q=fn(tx.objectStore('files'));tx.oncomplete=()=>resolve(q?.result);tx.onerror=tx.onabort=()=>reject(tx.error||Error('文件保存失败'))})}finally{db.close()}}
const allReports=()=>reportOp('readonly',s=>s.getAll());
let archiveView=0;
async function reportPanel(sample,record){let token=++archiveView, box=document.createElement('section');box.className='card';box.innerHTML='<h2>实验报告</h2><p class="mini">正在读取报告…</p>';el().appendChild(box);try{let files=(await allReports()).filter(f=>record?f.record===record.id:f.sample===sample).sort((a,b)=>b.created.localeCompare(a.created));if(token!==archiveView||!box.isConnected)return;let runs=state.records.filter(r=>r.test===sample).slice().reverse();box.innerHTML=`<h2>实验报告（${files.length}）</h2>${record?'':`<label>关联实验</label><select class="report-run"><option value="">仅归档到镜片（未关联实验）</option>${runs.map(r=>`<option value="${esc(r.id)}">${dt(r.started||r.created)}</option>`).join('')}</select>`}<input type="file" multiple accept=".doc,.docx,.pdf,.xls,.xlsx,.csv,.png,.jpg,.jpeg,.zip"><p class="mini">选择文件即保存原件，可添加多份报告，不覆盖旧文件。</p><div class="report-status" aria-live="polite"></div>${files.map(f=>`<div class="compact"><b>${esc(f.name)}</b><div class="mini">${dt(f.created)} · ${(f.blob.size/1024).toFixed(1)} KB · ${f.record?'实验：'+dt(state.records.find(r=>r.id===f.record)?.started||state.records.find(r=>r.id===f.record)?.created):'仅镜片归档'}</div><div class="row topspace"><button class="secondary" data-download="${esc(f.id)}">打开 / 导出</button><button class="secondary" data-remove="${esc(f.id)}">删除</button></div></div>`).join('')}`;let input=box.querySelector('input'),status=box.querySelector('.report-status');const refresh=()=>{if(!box.isConnected)return;if(record)detail();else showSampleDetail(sample)};input.onchange=async()=>{let chosen=[...input.files],rid=record?.id||box.querySelector('select')?.value||null;input.disabled=true;let n=0;try{for(let file of chosen){await reportOp('readwrite',s=>s.add({id:id(),sample,record:rid,name:file.name,created:new Date().toISOString(),blob:file}));n++}refresh()}catch(e){status.textContent=`已保存 ${n} 份，剩余保存失败：${e.message}`;input.disabled=false}};box.querySelectorAll('[data-download]').forEach(b=>b.onclick=async()=>{try{let f=await reportOp('readonly',s=>s.get(b.dataset.download));if(!f)throw Error('文件不存在');downloadFile(f.name,f.blob,f.blob.type||'application/octet-stream')}catch(e){alert(e.message)}});box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('删除这份报告原文件？'))return;try{await reportOp('readwrite',s=>s.delete(b.dataset.remove));refresh()}catch(e){alert(e.message)}})}catch(e){box.textContent='报告库无法读取：'+e.message}}
const detailV5=detail;detail=function(){detailV5();let r=state.records.find(r=>r.id===current);if(r)reportPanel(r.test,r)};
const sampleDetailV5=showSampleDetail;showSampleDetail=function(x){sampleDetailV5(x);if(state.samples.some(s=>s.id===x))reportPanel(x,null)};
const read64=blob=>new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=()=>reject(r.error);r.readAsDataURL(blob)});
exportData=async function(){try{let reports=await Promise.all((await allReports()).map(async f=>{let {blob,...meta}=f;return {...meta,type:blob.type,data:await read64(blob)}}));downloadFile('光学实验完整备份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'optics-lab',version:6,state,reports}), 'application/json')}catch(e){alert('备份失败：'+e.message)}};
const importV5=importData;importData=async function(e){let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!Array.isArray(obj.reports)){return importV5(e)}if(obj.app!=='optics-lab'||!['samples','records','steps'].every(k=>Array.isArray(obj.state?.[k])))throw Error('无效备份');let entries=obj.reports.map(({data,type,...meta})=>({...meta,blob:new Blob([Uint8Array.from(atob(data),c=>c.charCodeAt(0))],{type})}));if(!confirm('恢复完整备份将替换镜片、实验数据及报告库。继续？'))return;let previous=state;state=obj.state;try{save();await reportOp('readwrite',s=>{s.clear();entries.forEach(f=>s.put(f))})}catch(err){state=previous;save();throw err}location.reload()}catch(err){alert('恢复失败：'+err.message)}};

render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
